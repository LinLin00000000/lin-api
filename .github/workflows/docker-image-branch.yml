name: Lin API image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lin-api-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'LinLin00000000/lin-api' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    uses: ./.github/workflows/ci.yml
  image:
    needs: checks
    if: needs.checks.outputs.runtime_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Bind immutable source identity
        id: identity
        env:
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$SOURCE_SHA" > VERSION
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.identity.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
          sbom: true
      - name: Non-billable isolated artifact smoke
        env:
          IMAGE: ${{ steps.identity.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          docker run -d --name artifact-smoke -p 127.0.0.1:3300:3000 -e SQLITE_PATH=/data/smoke.db "$IMAGE"
          trap 'docker rm -f artifact-smoke >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            if curl --connect-timeout 5 --max-time 10 -fsS http://127.0.0.1:3300/api/status > /tmp/status.json; then break; fi
            sleep 2
          done
          python3 -c 'import json; assert json.load(open("/tmp/status.json"))["success"] is True'
          test "$(curl --connect-timeout 5 --max-time 10 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3300/v1/models)" = 401
          curl --connect-timeout 5 --max-time 10 -fsS http://127.0.0.1:3300/ >/dev/null
      - name: Publish deployment receipt
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf 'source_commit=%s\nartifact=%s@%s\nchecks=passed\nartifact_smoke=passed\n' "$SOURCE_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'LIN_API_RECEIPT {"source_commit":"%s","image":"%s","digest":"%s","artifact_smoke":"passed"}\n' "$SOURCE_SHA" "$IMAGE" "$DIGEST"
