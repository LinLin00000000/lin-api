name: CI

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]
  workflow_call:
    outputs:
      runtime_changed:
        value: ${{ jobs.changes.outputs.runtime_changed }}

permissions:
  contents: read

jobs:
  changes:
    name: Change and documentation checks
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.changes.outputs.runtime_changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test change detector failure boundaries
        run: python3 .github/scripts/test_runtime_changed.py
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          runtime_changed=$(python3 .github/scripts/runtime_changed.py)
          case "$runtime_changed" in true|false) ;; *) exit 1 ;; esac
          printf 'runtime_changed=%s\n' "$runtime_changed" >> "$GITHUB_OUTPUT"
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          fi
  backend:
    needs: changes
    if: needs.changes.outputs.runtime_changed == 'true'
    name: Backend vet, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Create frontend embed placeholder
        run: mkdir -p web/dist && touch web/dist/index.html
      - name: Vet and build root module
        run: go vet ./... && go build ./...
      - name: Vet and build relaykit
        working-directory: relaykit
        run: go vet ./... && go build ./...
      - name: Test root and relaykit modules
        run: make test
  frontend:
    needs: changes
    if: needs.changes.outputs.runtime_changed == 'true'
    name: Frontend typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
